# Plantilla genèrica. Compara-la amb el bloc de benzineres abans d'afegir-la
# a /etc/nginx/snippets/festeve/festeve.conf
location = /festeve/ambNassos { return 301 /festeve/ambNassos/; }

location /festeve/ambNassos/ {
    proxy_pass http://127.0.0.1:8204/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
