<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ambNassos</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <main class="container">

    <header>
      <h1>ambNassos</h1>
      <p class="subtitle">Campanya #RiuadeNassos</p>
    </header>

    <!-- Aquí aniran els menús i formularis (estil com la imatge de referència) -->
    <section class="card">
      <div class="field">
        <label for="exemple">Exemple de selector</label>
        <select id="exemple">
          <option>Opció 1</option>
          <option>Opció 2</option>
        </select>
      </div>

      <div class="toggle">
        <button type="button" class="active">Opció A</button>
        <button type="button">Opció B</button>
      </div>

      <button type="button" class="btn btn-blue btn-block">Consultar</button>
    </section>

    <section class="card campaign">
      <p>Campanya <strong>#RiuadeNassos</strong>: ajuda a fer somriure als nens ingressats a l'hospital.</p>
      <a class="btn btn-red" href="{{ apadrina_url }}">Apadrina un somriure</a>
    </section>

    <section class="card campaign">
      <p><strong>AmbNassos</strong>: transforma cares tristes en somriures en 40 segons.</p>
      <a class="btn btn-blue" href="joc">Jugar</a>
    </section>

    <footer>Web realitzada per Francesc Esteve</footer>

  </main>
</body>
</html>
